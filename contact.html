    <div class="collapse navbar-collapse" id="navbarScroll">
      <ul
        class="navbar-nav me-auto my-4 my-lg-0 navbar-nav-scroll"
        style="--bs-scroll-height: 100px"

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>

        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>

        <li class="nav-item dropdown">

      <form class="d-flex" role="search">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search"
          aria-label="Search"
        />
        <button class="btn btn-outline-success" type="submit">
          Search
        </button>
      </form>
    </div>
  </div>
</nav>


  <div class="contact-container">
    <h2 class="contact-heading">Contact Us</h2>
    <form class="contact-form">
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" placeholder="Enter your mobile number" required>
      </div>

      <!-- State and City -->
      <div class="form-row">
        <div class="form-group">
          <label for="state">State</label>
          <select id="state" required>
            <option value="" selected disabled>Select your state</option>
            <option value="State1">State 1</option>
            <option value="State2">State 2</option>
            <option value="State3">State 3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="Enter your city" required>
        </div>
      </div>

      <!-- Subject -->
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Enter the subject" required>
      </div>

      <!-- Message -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Have a question or request?" required></textarea>
      </div>

      <!-- Submit Button -->
      <div class="form-submit">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
